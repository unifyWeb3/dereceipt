# gltest configuration
#
# Rewritten at M4 against the schema gltest 0.29.2 actually accepts. The M2
# version used keys (`genvm_version`, `contract_runner`, `contract`, `tests`,
# `exclude`) that this gltest rejects outright:
#
#   ERROR: Invalid configuration keys. Valid keys are:
#   ['networks', 'paths', 'environment']
#
# and then, for the second attempt:
#
#   ERROR: environment must be a string
#
# `environment` is a path to an env *file*, not a mapping, so the GenVM pin is
# not put here. It is exported in the test command instead, which is where the
# runner actually reads it. The pins the M2 version carried are all preserved —
# two as documentation, one as an actual shell export.
#
# Direct tests need no network, no localnet and no Docker: `gltest.direct` runs a
# contract in pure Python behind a WASI mock. So this file configures the
# *local* (in-process) runner only and names no network at all. That is
# deliberate — naming a network here would invite an integration test that
# cannot run in this environment.

paths:
  contracts: contracts
  artifacts: artifacts

# GENVM_VERSION is exported by the test command, not set here:
#
#   GENVM_VERSION=v0.6.0-rc5 .venv/bin/python -m pytest tests/direct -q
#
# Why that value, which looks like a mistake and is not: the contract header
# targets the older v0.3 SDK layout that the live Studio-dev target actually
# runs (measured: GenVM v0.3.0-rc7), while direct tests run against v0.6.0-rc5.
# The mismatch is intentional and is what the 360/400 reference submission did.
#
# THE RULE: when a direct test disagrees with the live target, the live target is
# right.
#
# The runner the contract header pins, repeated as documentation because this
# file does not control it — the header at contracts/contest_receipt.py line 1
# does:
#
#   py-genlayer:5jycge4q8k23462jtb0b9fyey1s9qz928sz2nbrd9mg4sxqg2qng
#
# No network, no localnet, no faucet, no Docker. Anything needing one is an
# integration test and belongs to the live run at M6, not to tests/direct.
